<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#100e17" />
    <meta name="description" content="Challenge your mind with beautiful, bite-sized logic puzzles. Play Mind Challenge, track your progress, and unlock new levels." />
    <title>Mind Challenge — make room for a brighter mind</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar">
        <a class="brand" href="#" data-page="home" aria-label="Mind Challenge home">
          <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span><span></span></span>
          <span class="brand-name">Mind<span> Challenge</span></span>
        </a>

        <div class="sidebar-label">YOUR SPACE</div>
        <nav class="side-nav" aria-label="Main navigation">
          <button class="nav-link active" data-page="home">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="5" rx="2"/><rect x="13.5" y="12.5" width="7" height="8" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/></svg>
            <span>Overview</span>
          </button>
          <button class="nav-link" data-page="levels">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19.5h16M6.5 16V9.5M12 16V4.5M17.5 16v-3.5"/></svg>
            <span>All challenges</span><span class="nav-count" id="nav-count">08</span>
          </button>
          <button class="nav-link" data-page="leaderboard">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4ZM7 7H4v2a4 4 0 0 0 4 4m9-6h3v2a4 4 0 0 1-4 4"/></svg>
            <span>Leaderboard</span>
          </button>
        </nav>

        <div class="sidebar-label sidebar-label-lower">PERSONAL</div>
        <nav class="side-nav" aria-label="Personal navigation">
          <button class="nav-link" data-page="profile">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 20a7 7 0 0 1 14 0"/></svg>
            <span>My profile</span>
          </button>
        </nav>

        <div class="sidebar-spacer"></div>
        <div class="sidebar-tip">
          <div class="tip-orb" aria-hidden="true"><span>✦</span></div>
          <p class="tip-eyebrow">A LITTLE REMINDER</p>
          <p class="tip-copy">Your mind is like a garden. Give it something good to grow.</p>
          <span class="tip-sparkle" aria-hidden="true">✦ &nbsp; ✧</span>
        </div>
        <button class="theme-toggle" id="theme-toggle" aria-label="Switch to light mode">
          <svg class="theme-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg>
          <span>Light appearance</span>
          <span class="toggle-track"><span></span></span>
        </button>
        <div class="sidebar-footer">MADE FOR CURIOUS MINDS <span>✳</span></div>
      </aside>

      <main class="main-content">
        <header class="topbar">
          <button class="mobile-menu" id="mobile-menu" aria-label="Open navigation">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
          </button>
          <div class="breadcrumb"><span>YOUR SPACE</span><span class="breadcrumb-slash">/</span><strong id="breadcrumb-current">Overview</strong></div>
          <div class="topbar-right">
            <div class="streak-pill" title="Your current streak"><span class="streak-flame">✦</span><span id="top-streak">0</span><span class="streak-label">day streak</span></div>
            <span class="topbar-divider"></span>
            <button class="user-chip" id="auth-trigger" aria-label="Sign in or view your account">
              <span class="user-avatar" id="top-avatar">?</span>
              <span class="user-chip-copy"><strong id="top-name">Guest player</strong><small id="top-subtitle">Create your account</small></span>
              <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m8 10 4 4 4-4"/></svg>
            </button>
          </div>
        </header>

        <div id="page-content" class="page-content"></div>
        <footer class="page-footer"><span>MADE WITH A LITTLE CURIOSITY</span><span>© 2026 MIND CHALLENGE</span></footer>
      </main>
    </div>

    <div class="modal-backdrop" id="game-backdrop" hidden>
      <section class="game-modal" role="dialog" aria-modal="true" aria-labelledby="game-title">
        <div id="game-modal-content"></div>
      </section>
    </div>
    <div class="modal-backdrop" id="auth-backdrop" hidden>
      <section class="auth-modal" role="dialog" aria-modal="true" aria-labelledby="auth-title">
        <button class="modal-close" data-close-auth aria-label="Close dialog">×</button>
        <div class="auth-brand"><span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span><span></span></span><span class="brand-name">Mind<span> Challenge</span></span></div>
        <div id="auth-content"></div>
      </section>
    </div>
    <div class="modal-backdrop" id="confirm-backdrop" hidden>
      <section class="confirm-modal" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title" aria-describedby="confirm-message">
        <div class="confirm-icon" aria-hidden="true">!</div>
        <h2 id="confirm-title">Are you sure?</h2>
        <p id="confirm-message"></p>
        <div class="confirm-actions">
          <button class="button-secondary" id="confirm-cancel">Cancel</button>
          <button class="button-primary danger-button" id="confirm-accept">Confirm</button>
        </div>
      </section>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </body>
</html>
